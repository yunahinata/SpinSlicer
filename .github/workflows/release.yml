name: Build release artifacts

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            os: windows-latest
            archive: SpinSlicer-windows-x64.zip
          - platform: linux-x64
            os: ubuntu-latest
            archive: SpinSlicer-linux-x64.tar.gz

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtime and packaging dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller==6.22.2

      - name: Build Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $pythonRoot = python -c "import sys; print(sys.base_prefix)"
          $vcruntime140 = Join-Path $pythonRoot 'vcruntime140.dll'
          $vcruntime140_1 = Join-Path $pythonRoot 'vcruntime140_1.dll'
          if (!(Test-Path $vcruntime140) -or !(Test-Path $vcruntime140_1)) {
            throw 'Python VC++ runtime DLLs were not found'
          }
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name SpinSlicer `
            --collect-all qdarktheme `
            --collect-all pyvista `
            --collect-all pyvistaqt `
            --collect-all vtkmodules `
            --hidden-import vtkmodules.qt.QVTKRenderWindowInteractor `
            --add-data "assets/spinslicer.svg;assets" `
            --add-binary "$vcruntime140;." `
            --add-binary "$vcruntime140_1;." `
            SpinSlicer.py

      - name: Build Linux executable
        if: runner.os == 'Linux'
        shell: bash
        run: >-
          python -m PyInstaller
          --noconfirm
          --clean
          --onefile
          --windowed
          --name SpinSlicer
          --collect-all qdarktheme
          --collect-all pyvista
          --collect-all pyvistaqt
          --collect-all vtkmodules
          --hidden-import vtkmodules.qt.QVTKRenderWindowInteractor
          --add-data assets/spinslicer.svg:assets
          SpinSlicer.py

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm

      - name: Package Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist\SpinSlicer.exe -DestinationPath ${{ matrix.archive }}

      - name: Install Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command iscc.exe -ErrorAction SilentlyContinue)) {
            choco install innosetup --no-progress --yes
          }

      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          $releaseVersion = $env:RELEASE_VERSION -replace '^v', ''
          if ($releaseVersion -notmatch '^(\d+\.\d+\.\d+)') {
            $appVersion = '0.1.1'
            $releaseVersion = $appVersion
          } else {
            $appVersion = $Matches[1]
          }
          $releaseVersion = $releaseVersion -replace '[^0-9A-Za-z._+-]', '.'
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          $iscc = @(
            (Get-Command iscc.exe -ErrorAction SilentlyContinue).Source
            (Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe')
            (Join-Path $env:ProgramFiles 'Inno Setup 6\ISCC.exe')
          ) | Where-Object { $_ -and (Test-Path -LiteralPath $_) } | Select-Object -First 1
          if (-not $iscc) {
            throw 'Inno Setup compiler (ISCC.exe) was not found'
          }
          & $iscc "/DMyAppVersion=$appVersion" "/DMyAppRelease=$releaseVersion" /Orelease-assets packaging\SpinSlicer.iss
          $installer = "release-assets\SpinSlicer-Setup-$releaseVersion.exe"
          if (-not (Test-Path $installer)) {
            throw "Inno Setup did not produce $installer"
          }

      - name: Package Linux artifact
        if: runner.os == 'Linux'
        shell: bash
        run: tar -czf "${{ matrix.archive }}" -C dist SpinSlicer

      - name: Build Linux packages
        if: runner.os == 'Linux'
        shell: bash
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          OUTPUT_DIR: release-assets
        run: bash packaging/build_linux_packages.sh

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpinSlicer-${{ matrix.platform }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

      - name: Upload Windows executable
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: SpinSlicer-windows-executable
          path: dist/SpinSlicer.exe
          if-no-files-found: error

      - name: Upload Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: SpinSlicer-windows-installer
          path: release-assets/SpinSlicer-Setup-*.exe
          if-no-files-found: error

      - name: Upload Linux packages
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: SpinSlicer-linux-packages
          path: |
            release-assets/*.deb
            release-assets/*.rpm
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: SpinSlicer-*
          path: release-assets
          merge-multiple: true

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          name: SpinSlicer ${{ github.ref_name }}
          body: |
            ## SpinSlicer ${{ github.ref_name }}

            ### Changelog

            - Fixed the ViewCube drag direction so it follows the pointer.
            - Reduced the orientation arrowheads and moved the axis origin to the cube edge.
            - Shifted the ViewCube slightly left within the viewport.
            - Removed post-release camera inertia so rotation stops with the pointer without overshoot.
            - Matched the reference cube labels and external XYZ colors without adding Home or down controls.
            - Anchored the XYZ arrows to the continuation of the cube edges and removed horizontal drag inversion.
            - Made the edge-continuation arrows longer, solid, and slightly thicker.
            - Matched the reference arrows with flat primary RGB colors and continuous line shafts.
          generate_release_notes: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true

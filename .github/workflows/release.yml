name: Build release artifacts

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            os: windows-latest
            archive: SpinSlicer-windows-x64.zip
          - platform: linux-x64
            os: ubuntu-latest
            archive: SpinSlicer-linux-x64.tar.gz

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtime and packaging dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller==6.22.2

      - name: Build Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $pythonRoot = python -c "import sys; print(sys.base_prefix)"
          $vcruntime140 = Join-Path $pythonRoot 'vcruntime140.dll'
          $vcruntime140_1 = Join-Path $pythonRoot 'vcruntime140_1.dll'
          if (!(Test-Path $vcruntime140) -or !(Test-Path $vcruntime140_1)) {
            throw 'Python VC++ runtime DLLs were not found'
          }
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name SpinSlicer `
            --collect-all qdarktheme `
            --collect-all pyvista `
            --collect-all pyvistaqt `
            --collect-all vtkmodules `
            --hidden-import vtkmodules.qt.QVTKRenderWindowInteractor `
            --add-binary "$vcruntime140;." `
            --add-binary "$vcruntime140_1;." `
            SpinSlicer.py

      - name: Build Linux executable
        if: runner.os == 'Linux'
        shell: bash
        run: >-
          python -m PyInstaller
          --noconfirm
          --clean
          --onefile
          --windowed
          --name SpinSlicer
          --collect-all qdarktheme
          --collect-all pyvista
          --collect-all pyvistaqt
          --collect-all vtkmodules
          --hidden-import vtkmodules.qt.QVTKRenderWindowInteractor
          SpinSlicer.py

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm

      - name: Package Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist\SpinSlicer.exe -DestinationPath ${{ matrix.archive }}

      - name: Package Linux artifact
        if: runner.os == 'Linux'
        shell: bash
        run: tar -czf "${{ matrix.archive }}" -C dist SpinSlicer

      - name: Build Linux packages
        if: runner.os == 'Linux'
        shell: bash
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          OUTPUT_DIR: release-assets
        run: bash packaging/build_linux_packages.sh

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpinSlicer-${{ matrix.platform }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

      - name: Upload Windows executable
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: SpinSlicer-windows-executable
          path: dist/SpinSlicer.exe
          if-no-files-found: error

      - name: Upload Linux packages
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: SpinSlicer-linux-packages
          path: |
            release-assets/*.deb
            release-assets/*.rpm
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: SpinSlicer-*
          path: release-assets
          merge-multiple: true

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          name: SpinSlicer ${{ github.ref_name }}
          body: |
            ## ✨ SpinSlicer ${{ github.ref_name }}

            A pre-alpha desktop workspace for tomographic volumetric additive manufacturing (VAM).

            > ⚠️ **Experimental build.** This release is intended for local research and UI/algorithm testing. It does not control a real projector, resin vat, or rotation stage.

            ### What is included

            - 🧊 STL loading, transforms, and a PyVista/VTK 3D viewport
            - 🎛️ Direct 3D gizmo with movement arrows, rotation rings, scale handles, and an XYZ orientation cube
            - ✨ Eased transform animation for smoother move, rotate, and scale interactions
            - 🌀 Deterministic projection generation with the internal Radon backend
            - 🧵 Parametric threaded-nut model for repeatable experiments
            - 🎞️ Frame playback, MP4 export, and filtered-back-projection preview
            - ✅ Validated manifests and an offline virtual-printer simulation path
            - 🛠️ Windows package includes the NumPy-compatible VC++ runtime and current PyInstaller hooks

            ### Downloads

            Choose the package for your platform from the files below:

            | Platform | Recommended file |
            | --- | --- |
            | Windows 10/11 x64 | `SpinSlicer.exe` or the Windows `.zip` |
            | Debian/Ubuntu x64 | `.deb` |
            | Fedora/RHEL x64 | `.rpm` |
            | Other Linux x64 | Portable `.tar.gz` |

            **Windows:** download `SpinSlicer.exe` and launch it directly. The VC++ runtime needed by NumPy is bundled in this build.

            **Debian/Ubuntu:** `sudo apt install ./SpinSlicer-*.deb`

            **Fedora/RHEL:** `sudo dnf install ./SpinSlicer-*.rpm`

            ### Known limitations

            - Hardware output and automatic exposure feedback are not implemented.
            - Linux packages target x86_64.
            - Pre-alpha builds may change file formats and UI behaviour.

            📚 [Read the full README](https://github.com/yunahinata/SpinSlicer#readme) · 🐛 [Report an issue](https://github.com/yunahinata/SpinSlicer/issues/new)
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true

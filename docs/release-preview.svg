<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">SpinSlicer release preview</title>
  <desc id="desc">A dark branded preview of the SpinSlicer desktop workspace with a 3D viewport, projection frames, and run status.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#111a35"/>
      <stop offset="1" stop-color="#19102f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#62e8ff"/>
      <stop offset="1" stop-color="#a889ff"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b6cff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#3bd8ef" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#02040b" flood-opacity="0.55"/>
    </filter>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#8bb6ff" stroke-opacity="0.07"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" rx="34" fill="url(#bg)"/>
  <circle cx="1430" cy="60" r="250" fill="#6f5bff" opacity="0.12" filter="url(#glow)"/>
  <circle cx="110" cy="820" r="220" fill="#27d8e9" opacity="0.08" filter="url(#glow)"/>
  <rect x="0" y="0" width="1600" height="900" rx="34" fill="url(#grid)"/>

  <g transform="translate(92 80)">
    <rect width="1416" height="740" rx="24" fill="#090d1a" fill-opacity="0.88" stroke="#7184bc" stroke-opacity="0.3" filter="url(#shadow)"/>
    <rect width="1416" height="58" rx="24" fill="#151d34"/>
    <rect y="34" width="1416" height="24" fill="#151d34"/>
    <circle cx="31" cy="29" r="7" fill="#ff6d8a"/>
    <circle cx="55" cy="29" r="7" fill="#ffd166"/>
    <circle cx="79" cy="29" r="7" fill="#54e39b"/>
    <text x="112" y="36" fill="#dbe7ff" font-family="Inter,Segoe UI,sans-serif" font-size="18" font-weight="600">SpinSlicer</text>
    <text x="1270" y="36" fill="#8f9abd" font-family="Inter,Segoe UI,sans-serif" font-size="14">v0.1 alpha</text>

    <rect x="28" y="84" width="190" height="628" rx="16" fill="#10172a" stroke="#2a3658"/>
    <text x="52" y="130" fill="#eef4ff" font-family="Inter,Segoe UI,sans-serif" font-size="22" font-weight="700">Workspace</text>
    <rect x="48" y="157" width="150" height="42" rx="10" fill="url(#accent)"/>
    <text x="70" y="184" fill="#09101f" font-family="Inter,Segoe UI,sans-serif" font-size="15" font-weight="700">Slicer</text>
    <text x="70" y="241" fill="#9ca9ca" font-family="Inter,Segoe UI,sans-serif" font-size="15">Projector</text>
    <text x="70" y="290" fill="#9ca9ca" font-family="Inter,Segoe UI,sans-serif" font-size="15">Simulator</text>
    <line x1="48" y1="330" x2="198" y2="330" stroke="#2a3658"/>
    <text x="52" y="371" fill="#7584a8" font-family="Inter,Segoe UI,sans-serif" font-size="12" letter-spacing="1.5">CURRENT RUN</text>
    <text x="52" y="407" fill="#dce7ff" font-family="Inter,Segoe UI,sans-serif" font-size="14">threaded_nut</text>
    <text x="52" y="436" fill="#7584a8" font-family="Inter,Segoe UI,sans-serif" font-size="12">384 frames · 1024²</text>
    <rect x="52" y="486" width="142" height="8" rx="4" fill="#293554"/>
    <rect x="52" y="486" width="108" height="8" rx="4" fill="url(#accent)"/>
    <text x="52" y="526" fill="#6ee7ca" font-family="Inter,Segoe UI,sans-serif" font-size="13">● Ready to preview</text>

    <rect x="242" y="84" width="732" height="400" rx="16" fill="#0f1729" stroke="#2a3658"/>
    <text x="270" y="126" fill="#e8f0ff" font-family="Inter,Segoe UI,sans-serif" font-size="18" font-weight="700">3D viewport</text>
    <text x="838" y="126" fill="#7e8db0" font-family="Inter,Segoe UI,sans-serif" font-size="13">STL · watertight mesh</text>
    <rect x="270" y="151" width="676" height="294" rx="12" fill="#0b1120"/>
    <ellipse cx="608" cy="302" rx="164" ry="62" fill="#36d5ef" opacity="0.22" filter="url(#glow)"/>
    <path d="M475 265 C475 228 536 205 608 205 C680 205 741 228 741 265 L741 354 C741 391 680 414 608 414 C536 414 475 391 475 354Z" fill="url(#violet)" opacity="0.78"/>
    <ellipse cx="608" cy="265" rx="133" ry="49" fill="#172344" stroke="#8c83ff" stroke-width="3"/>
    <ellipse cx="608" cy="265" rx="72" ry="25" fill="#080d1b" stroke="#62e8ff" stroke-width="3"/>
    <path d="M535 277 C555 292 578 298 608 298 C638 298 661 292 681 277" fill="none" stroke="#62e8ff" stroke-width="4" opacity="0.9"/>
    <path d="M525 312 C550 326 580 333 608 333 C636 333 666 326 691 312 M520 347 C548 360 578 368 608 368 C638 368 668 360 696 347" fill="none" stroke="#a889ff" stroke-width="3" opacity="0.65"/>
    <line x1="608" y1="177" x2="608" y2="413" stroke="#d9e8ff" stroke-opacity="0.14" stroke-dasharray="5 8"/>
    <line x1="400" y1="382" x2="815" y2="382" stroke="#d9e8ff" stroke-opacity="0.14"/>

    <rect x="992" y="84" width="396" height="400" rx="16" fill="#0f1729" stroke="#2a3658"/>
    <text x="1020" y="126" fill="#e8f0ff" font-family="Inter,Segoe UI,sans-serif" font-size="18" font-weight="700">Projection preview</text>
    <text x="1020" y="158" fill="#7e8db0" font-family="Inter,Segoe UI,sans-serif" font-size="13">angle 214 / 384</text>
    <g transform="translate(1020 184)">
      <rect width="340" height="178" rx="10" fill="#080d1b" stroke="#293554"/>
      <g opacity="0.9">
        <path d="M20 136 L54 116 L82 121 L118 80 L151 96 L185 48 L214 79 L246 60 L278 97 L320 31" fill="none" stroke="#62e8ff" stroke-width="4"/>
        <path d="M20 147 L54 132 L82 136 L118 99 L151 113 L185 68 L214 99 L246 79 L278 113 L320 48" fill="none" stroke="#8b6cff" stroke-width="2" opacity="0.7"/>
      </g>
      <line x1="20" y1="148" x2="320" y2="148" stroke="#3a486c"/>
      <line x1="20" y1="28" x2="20" y2="148" stroke="#3a486c"/>
    </g>
    <rect x="1020" y="386" width="150" height="50" rx="10" fill="#172441"/>
    <text x="1040" y="407" fill="#7584a8" font-family="Inter,Segoe UI,sans-serif" font-size="11">EXPOSURE</text>
    <text x="1040" y="427" fill="#e6efff" font-family="Inter,Segoe UI,sans-serif" font-size="16" font-weight="700">0.84 normalized</text>
    <rect x="1184" y="386" width="176" height="50" rx="10" fill="#172441"/>
    <text x="1204" y="407" fill="#7584a8" font-family="Inter,Segoe UI,sans-serif" font-size="11">BACKEND</text>
    <text x="1204" y="427" fill="#e6efff" font-family="Inter,Segoe UI,sans-serif" font-size="16" font-weight="700">SpinSlicer Radon</text>

    <rect x="242" y="508" width="1146" height="204" rx="16" fill="#10172a" stroke="#2a3658"/>
    <text x="270" y="550" fill="#e8f0ff" font-family="Inter,Segoe UI,sans-serif" font-size="18" font-weight="700">Run summary</text>
    <text x="270" y="584" fill="#7e8db0" font-family="Inter,Segoe UI,sans-serif" font-size="13">Ready for offline simulation · output manifest validated</text>
    <g transform="translate(270 617)">
      <rect width="230" height="62" rx="10" fill="#16233b"/>
      <text x="18" y="25" fill="#7584a8" font-family="Inter,Segoe UI,sans-serif" font-size="11">FRAME SET</text>
      <text x="18" y="48" fill="#dce7ff" font-family="Inter,Segoe UI,sans-serif" font-size="17" font-weight="700">384 PNG frames</text>
      <rect x="250" width="230" height="62" rx="10" fill="#16233b"/>
      <text x="268" y="25" fill="#7584a8" font-family="Inter,Segoe UI,sans-serif" font-size="11">RECONSTRUCTION</text>
      <text x="268" y="48" fill="#dce7ff" font-family="Inter,Segoe UI,sans-serif" font-size="17" font-weight="700">FBP preview ready</text>
      <rect x="500" width="230" height="62" rx="10" fill="#16233b"/>
      <text x="518" y="25" fill="#7584a8" font-family="Inter,Segoe UI,sans-serif" font-size="11">VALIDATION</text>
      <text x="518" y="48" fill="#6ee7ca" font-family="Inter,Segoe UI,sans-serif" font-size="17" font-weight="700">All checks passed</text>
      <rect x="750" width="336" height="62" rx="10" fill="url(#accent)" opacity="0.95"/>
      <text x="778" y="39" fill="#09101f" font-family="Inter,Segoe UI,sans-serif" font-size="18" font-weight="700">Explore the workspace →</text>
    </g>
  </g>
</svg>
